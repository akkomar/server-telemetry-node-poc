---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-http-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      component: test-http-sink
  template:
    metadata:
      labels:
        component: test-http-sink
    spec:
      containers:
        - name: test-http-sink
          image: gcr.io/akomar-server-telemetry-poc/test-http-sink
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 4000m        # 2 vcpu (same as publisher for fair test)
              memory: 512Mi

          # Health checks
          livenessProbe:
            httpGet:
              path: /__heartbeat__
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /__lbheartbeat__
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: test-http-sink
spec:
  type: LoadBalancer  # Creates public IP (goes through GCP LB)
  selector:
    component: test-http-sink
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
